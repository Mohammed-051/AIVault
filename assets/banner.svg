<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="AIVault — one library and router for every AI skill" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280"/>
    <path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
  </g>
  <!-- vault mark: dial + routes to skills -->
  <g transform="translate(150 200)">
    <g stroke="#7dd3fc" stroke-opacity="0.85" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M58 0 C 110 0, 110 -92, 170 -92"/>
      <path d="M58 0 H 170"/>
      <path d="M58 0 C 110 0, 110 92, 170 92"/>
    </g>
    <circle r="86" fill="#0f172a" stroke="url(#accent)" stroke-width="6"/>
    <circle r="56" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 8"/>
    <circle r="22" fill="url(#accent)"/>
    <g fill="#e2e8f0">
      <circle cx="170" cy="-92" r="11"/><circle cx="170" cy="0" r="11"/><circle cx="170" cy="92" r="11"/>
    </g>
  </g>
  <text x="400" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#f8fafc" letter-spacing="-2">AIVault</text>
  <text x="404" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#cbd5e1">One library and router for every AI skill, connector and tool.</text>
  <text x="404" y="286" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" fill="#5eead4">paste a repo link → security-scanned → sorted → routed</text>
  <text x="404" y="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">Code · Writing · Content · Media · Documents · Research  —  zero dependencies, any agent</text>
</svg>
